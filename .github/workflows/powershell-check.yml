name: PowerShell checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-checks:
    name: Windows PowerShell 5.1 checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host ("PowerShell runtime: {0}" -f $PSVersionTable.PSVersion)
          Write-Host ("PowerShell edition: {0}" -f $PSVersionTable.PSEdition)

          if ($PSVersionTable.PSVersion -lt [version]'5.1') {
              throw 'Windows PowerShell 5.1 or newer is required.'
          }

          if ($PSVersionTable.PSEdition -ne 'Desktop') {
              throw 'This workflow must run under Windows PowerShell (Desktop), not PowerShell Core.'
          }

      - name: Check required project files
        shell: powershell
        run: |
          $requiredFiles = @(
              'VoiceMeeter-IdleWatcher.ps1',
              'VoiceMeeter-IdleWatcher.vbs',
              'README.md',
              'README.ru.md',
              'PROJECT_CONTEXT.md',
              'ARCHITECTURE.md',
              'CHANGELOG.md'
          )

          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })

          if ($missingFiles.Count -gt 0) {
              $missingFiles | ForEach-Object { Write-Error ("Required project file is missing: {0}" -f $_) }
              exit 1
          }

          Write-Host 'All required project files are present.'

      - name: Parse PowerShell source with Windows PowerShell 5.1
        shell: powershell
        run: |
          $scriptPath = 'VoiceMeeter-IdleWatcher.ps1'
          $tokens = $null
          $parseErrors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $scriptPath).Path,
              [ref]$tokens,
              [ref]$parseErrors
          ) | Out-Null

          if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                  Write-Error ("Line {0}, column {1}: {2}" -f
                      $parseError.Extent.StartLineNumber,
                      $parseError.Extent.StartColumnNumber,
                      $parseError.Message)
              }

              exit 1
          }

          Write-Host 'PowerShell parser found no syntax errors.'

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
          }

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber -Confirm:$false
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force

          Write-Host ("PSScriptAnalyzer version: {0}" -f (Get-Module PSScriptAnalyzer).Version)

      - name: Report PSScriptAnalyzer findings
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = 'VoiceMeeter-IdleWatcher.ps1'

          $findings = @(Invoke-ScriptAnalyzer -Path $scriptPath -Severity Error,Warning,Information)

          if ($findings.Count -eq 0) {
              Write-Host 'PSScriptAnalyzer reported no findings.'
          }
          else {
              Write-Host ("PSScriptAnalyzer reported {0} finding(s):" -f $findings.Count)

              foreach ($finding in $findings) {
                  $line = $finding.Line
                  if (-not $line) { $line = '?' }

                  Write-Output ("[{0}] {1}, line {2}: {3}" -f
                      $finding.Severity,
                      $finding.RuleName,
                      $line,
                      $finding.Message)
              }

              Write-Host 'Baseline mode: analyzer findings are reported for review and do not fail the workflow yet.'
          }
