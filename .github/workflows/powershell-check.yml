name: Modular PowerShell 5.1 checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host ("PowerShell runtime: {0}" -f $PSVersionTable.PSVersion)
          Write-Host ("PowerShell edition: {0}" -f $PSVersionTable.PSEdition)

          if ($PSVersionTable.PSVersion -lt [version]'5.1') {
            throw 'Windows PowerShell 5.1 or newer is required.'
          }

          if ($PSVersionTable.PSEdition -ne 'Desktop') {
            throw 'This workflow must run under Windows PowerShell (Desktop), not PowerShell Core.'
          }

      - name: Parse PowerShell 5.1 sources and verify project contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $powerShellFiles = @(
            'VoiceMeeter-IdleWatcher.ps1',
            'VoiceMeeter-IdleWatcher.psd1',
            'VoiceMeeter-IdleWatcher.Support.psm1',
            'VoiceMeeter-IdleWatcher.Interop.psm1',
            'VoiceMeeter-IdleWatcher.MacroButtons.psm1'
          )

          foreach ($path in $powerShellFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required PowerShell source is missing: $path"
            }

            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $details = ($parseErrors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parser errors in $path - $details"
            }
          }

          $styleFiles = $powerShellFiles + @(
            'VoiceMeeter-IdleWatcher.vbs',
            'VMRIdleWatcherNative.cs'
          )
          foreach ($path in $styleFiles) {
            $lineNumber = 0
            foreach ($line in [System.IO.File]::ReadAllLines((Resolve-Path -LiteralPath $path).Path)) {
              $lineNumber++
              if ($line -match '^ +\S') {
                throw "Indentation uses spaces in $path at line $lineNumber; use tabs."
              }
            }
          }

          $config = Import-PowerShellDataFile -Path 'VoiceMeeter-IdleWatcher.psd1'
          if ($config.MacroButtonLogicalIndex -ne 1) {
            throw 'The default MacroButtons logical index must remain 1.'
          }
          if ($config.ContainsKey('MacroButtonStateOnlyMode')) {
            throw 'STATEONLY must not be configurable in PSD1.'
          }

          $ps1 = Get-Content -LiteralPath 'VoiceMeeter-IdleWatcher.ps1' -Raw
          if ($ps1 -notmatch '\$WatcherVersion\s*=\s*''1\.0\.5''') {
            throw 'Watcher version must match the integrated modular source baseline 1.0.5.'
          }

          $refreshDelayMatch = [regex]::Match($ps1, '\$macroButtonRefreshDelayMs\s*=\s*(\d+)')
          if (-not $refreshDelayMatch.Success -or [int]$refreshDelayMatch.Groups[1].Value -ne 1000) {
            throw 'Pre-shutdown MacroButtons refresh allowance must remain exactly 1000ms.'
          }
          $offRequestPosition = $ps1.IndexOf('$macroButtonOffResult = Invoke-MacroButtonStateSync -DesiredState 0 -Force -PassThru')
          $refreshWaitPosition = $ps1.IndexOf('Start-Sleep -Milliseconds $macroButtonRefreshDelayMs', $offRequestPosition)
          if (($offRequestPosition -lt 0) -or ($refreshWaitPosition -lt 0)) {
            throw 'Could not locate the pre-shutdown OFF request and its refresh wait.'
          }
          $successGuardPosition = $ps1.LastIndexOf('if ($macroButtonOffResult -eq $true)', $refreshWaitPosition)
          $finalValidationPosition = $ps1.IndexOf('$idleMsAfterOff = ', $refreshWaitPosition)
          if (($successGuardPosition -le $offRequestPosition) -or ($refreshWaitPosition -le $successGuardPosition) -or ($finalValidationPosition -le $refreshWaitPosition)) {
            throw 'Required order is OFF request -> success guard -> refresh wait -> final safety validation.'
          }
          $shutdownCommandPosition = $ps1.IndexOf("[VMRIdleWatcherNative]::SetParameterFloat('Command.Shutdown'", $finalValidationPosition)
          $successLogPosition = $ps1.IndexOf('Write-Log "Final pre-Shutdown validation passed', $finalValidationPosition)
          $successBranchPosition = $ps1.LastIndexOf('else {', $successLogPosition)
          if (($shutdownCommandPosition -le $finalValidationPosition) -or ($successLogPosition -le $shutdownCommandPosition) -or ($successBranchPosition -le $finalValidationPosition)) {
            throw 'Shutdown dispatch and post-dispatch success logging must follow final safety validation.'
          }
          $dispatchGap = $ps1.Substring($successBranchPosition, $shutdownCommandPosition - $successBranchPosition)
          if ($dispatchGap -match 'Write-Log') {
            throw 'No potentially blocking log write may occur between final safety checks and Command.Shutdown.'
          }
          if ($shutdownCommandPosition -le $finalValidationPosition) { throw 'Shutdown must follow final pre-shutdown validation.' }
          $finalValidationBlock = $ps1.Substring($finalValidationPosition, $shutdownCommandPosition - $finalValidationPosition)
          if (($finalValidationBlock -notmatch '\$idleMsAfterOff\s*-lt\s*\$thresholdMs') -or ($finalValidationBlock -notmatch '\$displayStateAfterOff\s*-ne\s*0') -or ($finalValidationBlock -notmatch '\$stopRequestedAfterOff')) {
            throw 'Idle, display and graceful-stop checks must remain after the MacroButtons refresh wait.'
          }
          if (-not $ps1.Contains('$macroButtonRestoreResult = Invoke-MacroButtonStateSync -DesiredState 1')) { throw 'Shutdown cancellation must retain ON restoration.' }
          if ($ps1 -match '\$initialMacroButtonState|\$reloginMacroButtonState') { throw 'Initial/recovery Login must not write MacroButtons OFF when VoiceMeeter is absent.' }
          if (([regex]::Matches($ps1, '\$apiEngineStateKnown\s+-and\s+\$voiceMeeterIsRunning')).Count -lt 4) { throw 'Periodic sync and manual refresh must require a confirmed running engine.' }
          if ($ps1 -notmatch 'Skipping periodic MacroButtons synchronization because VoiceMeeter is confirmed stopped') { throw 'Periodic writes must be skipped after known server teardown.' }
          if ($ps1 -notmatch 'MacroButtons refresh request ignored because VoiceMeeter is confirmed stopped') { throw 'Manual refresh must be skipped after known server teardown.' }
          if ($ps1 -match 'Invoke-MacroButtonStateSync\s+-DesiredState\s+0\s+-Force\s+-PassThru\s+\|\s+Out-Null') { throw 'Do not attempt a MacroButtons OFF write after the Remote API server has returned -2.' }
          $interop = Get-Content -LiteralPath 'VoiceMeeter-IdleWatcher.Interop.psm1' -Raw
          if ($interop -match 'Split-Path\s+-LiteralPath\s+\$uninstallExe\s+-Parent') { throw 'Do not combine Split-Path -LiteralPath and -Parent.' }
          if (($interop -notmatch '\[System\.IO\.File\]::Exists\(\$uninstallExe\)') -or ($interop -notmatch '\[System\.IO\.Path\]::GetDirectoryName\(\$uninstallExe\)')) { throw 'Registry lookup must use the .NET file/path methods.' }
          $macroModule = Get-Content -LiteralPath 'VoiceMeeter-IdleWatcher.MacroButtons.psm1' -Raw
          if ($ps1 -match 'MacroButtonStateOnlyMode') {
            throw 'The orchestrator must not expose a configurable MacroButtons bitmode.'
          }
          if (([regex]::Matches($macroModule, '\$script:MacroButtonStateOnlyMode\s*=\s*0x00000002')).Count -ne 1) {
            throw 'MacroButtons module must define STATEONLY exactly once.'
          }
          if ($macroModule -notmatch 'function Get-MacroButtonSyncStatus') {
            throw 'MacroButtons module must expose its last accepted write status for operational logging.'
          }
          if ($macroModule -match 'VBVMR_MacroButton_GetStatus|MacroButton_GetStatus|GetStatus') {
            throw 'MacroButtons state readback is not part of this project.'
          }

          $supportImport = $ps1.IndexOf('VoiceMeeter-IdleWatcher.Support.psm1')
          $interopImport = $ps1.IndexOf('VoiceMeeter-IdleWatcher.Interop.psm1')
          $macroImport = $ps1.IndexOf('VoiceMeeter-IdleWatcher.MacroButtons.psm1')
          if (-not ($supportImport -lt $interopImport -and $interopImport -lt $macroImport)) {
            throw 'Module import order must be Support -> Interop -> MacroButtons.'
          }

          $nativePath = 'VMRIdleWatcherNative.cs'
          $nativeSource = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $nativePath).Path, [System.Text.Encoding]::UTF8)
          $marker = '__VOICEMEETER_DLL_PATH__'
          if ([regex]::Matches($nativeSource, [regex]::Escape($marker)).Count -ne 1) {
            throw 'C# source must contain exactly one VoiceMeeter DLL path marker.'
          }

          $dummyDllPath = 'C:\VB-Audio\VoicemeeterRemote64.dll'
          $compiledSource = $nativeSource.Replace($marker, $dummyDllPath.Replace('"', '""'))
          Add-Type -TypeDefinition $compiledSource -Language CSharp -ErrorAction Stop

          $requiredFiles = @(
            'README.md',
            'README.ru.md',
            'ARCHITECTURE.md',
            'CHANGELOG.md',
            'PROJECT_CONTEXT.md',
            'CODE_OF_CONDUCT.md',
            'LICENSE',
            'SECURITY.md',
            'ROADMAP.md',
            'AGENTS.md',
            'REPOSITORY_LINEAGE.md',
            'GROK_REVIEW_BRIEF.md',
            'RELEASE_NOTES_v1.0.0.md',
            'RELEASE_NOTES_v1.0.5.md'
          )
          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required project document is missing: $path"
            }
          }

          $vbsOutput = & cscript.exe //nologo 'VoiceMeeter-IdleWatcher.vbs' '/__ci_invalid_argument__' 2>&1
          $vbsExitCode = $LASTEXITCODE
          $vbsText = ($vbsOutput | Out-String)
          if (($vbsExitCode -ne 4) -or ($vbsText -notmatch 'Unknown argument: /__ci_invalid_argument__')) {
            throw "VBS launcher validation failed (exit code $vbsExitCode). Output: $vbsText"
          }
          Write-Host 'VBS launcher invalid-argument path passed without starting the watcher.'
          $global:LASTEXITCODE = 0

          Write-Host 'PowerShell 5.1 parsing, project contracts and C# compilation passed.'

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
          }

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber -Confirm:$false
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force

          Write-Host ("PSScriptAnalyzer version: {0}" -f (Get-Module PSScriptAnalyzer).Version)

      - name: Report PSScriptAnalyzer findings
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptFiles = @(
            'VoiceMeeter-IdleWatcher.ps1',
            'VoiceMeeter-IdleWatcher.Support.psm1',
            'VoiceMeeter-IdleWatcher.Interop.psm1',
            'VoiceMeeter-IdleWatcher.MacroButtons.psm1'
          )

          $findings = @()
          foreach ($scriptFile in $scriptFiles) {
            $findings += @(Invoke-ScriptAnalyzer -Path $scriptFile -Severity Error,Warning,Information)
          }

          if ($findings.Count -eq 0) {
            Write-Host 'PSScriptAnalyzer reported no findings.'
          }
          else {
            Write-Host ("PSScriptAnalyzer reported {0} finding(s):" -f $findings.Count)

            foreach ($finding in $findings) {
              $line = $finding.Line
              if (-not $line) { $line = '?' }

              Write-Output ("[{0}] {1}, {2}, line {3}: {4}" -f
                $finding.Severity,
                $finding.ScriptName,
                $finding.RuleName,
                $line,
                $finding.Message)
            }
          }

          $errorFindings = @($findings | Where-Object { $_.Severity -eq 'Error' })
          if ($errorFindings.Count -gt 0) {
            throw ("PSScriptAnalyzer reported {0} Error-level finding(s). The workflow cannot pass until they are fixed." -f $errorFindings.Count)
          }

          Write-Host 'No Error-level findings. Warning and Information findings are reported but remain non-blocking.'

