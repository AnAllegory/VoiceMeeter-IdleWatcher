name: PowerShell checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-checks:
    name: Windows PowerShell 5.1 checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host ("PowerShell runtime: {0}" -f $PSVersionTable.PSVersion)
          Write-Host ("PowerShell edition: {0}" -f $PSVersionTable.PSEdition)

          if ($PSVersionTable.PSVersion -lt [version]'5.1') {
              throw 'Windows PowerShell 5.1 or newer is required.'
          }

          if ($PSVersionTable.PSEdition -ne 'Desktop') {
              throw 'This workflow must run under Windows PowerShell (Desktop), not PowerShell Core.'
          }

      - name: Check required project files
        shell: powershell
        run: |
          $requiredFiles = @(
              'VoiceMeeter-IdleWatcher.ps1',
              'VoiceMeeter-IdleWatcher.vbs',
              'README.md',
              'README.ru.md',
              'PROJECT_CONTEXT.md',
              'AGENTS.md',
              'SECURITY.md',
              'ARCHITECTURE.md',
              'CHANGELOG.md',
              'LICENSE',
              'RELEASE_NOTES_v1.0.0.md'
          )

          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })

          if ($missingFiles.Count -gt 0) {
              $missingFiles | ForEach-Object { Write-Error ("Required project file is missing: {0}" -f $_) }
              exit 1
          }

          Write-Host 'All required project files are present.'

      - name: Parse PowerShell source with Windows PowerShell 5.1
        shell: powershell
        run: |
          $scriptPath = 'VoiceMeeter-IdleWatcher.ps1'
          $tokens = $null
          $parseErrors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $scriptPath).Path,
              [ref]$tokens,
              [ref]$parseErrors
          ) | Out-Null

          if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                  Write-Error ("Line {0}, column {1}: {2}" -f
                      $parseError.Extent.StartLineNumber,
                      $parseError.Extent.StartColumnNumber,
                      $parseError.Message)
              }

              exit 1
          }

          Write-Host 'PowerShell parser found no syntax errors.'

      - name: Validate VBScript launcher with Windows Script Host
        shell: powershell
        run: |
          $scriptPath = 'VoiceMeeter-IdleWatcher.vbs'
          $cscriptPath = Join-Path -Path $env:SystemRoot -ChildPath 'System32\cscript.exe'

          if (-not (Test-Path -LiteralPath $cscriptPath -PathType Leaf)) {
              throw 'Windows Script Host cscript.exe was not found.'
          }

          # An intentionally invalid argument exercises the launcher's parser and
          # exits before it can start the PowerShell watcher.
          $output = & $cscriptPath //nologo $scriptPath /__syntax_check__ 2>&1
          $exitCode = $LASTEXITCODE
          $outputText = $output -join [Environment]::NewLine

          if ($exitCode -ne 4) {
              throw ("VBScript launcher returned exit code {0}, expected 4. Output: {1}" -f $exitCode, $outputText)
          }

          if ($outputText -notmatch [regex]::Escape('Unknown argument: /__syntax_check__')) {
              throw ("VBScript launcher did not report the expected invalid-argument message. Output: {0}" -f $outputText)
          }

          Write-Host 'VBScript launcher parsed successfully and rejected an invalid argument without starting the watcher.'

      - name: Verify MacroButtons synchronization safety contract
        shell: powershell
        run: |
          $source = Get-Content -LiteralPath 'VoiceMeeter-IdleWatcher.ps1' -Raw

          $requiredPatterns = @(
              'EntryPoint = "VBVMR_MacroButton_SetStatus"',
              '\$MacroButtonStateOnlyMode = 0x00000002',
              'EventResetMode.AutoReset',
              'WaitForWatcherEvent',
              'CreateExternalSyncEvent',
              'MacroButtonSetStatus\('
          )

          foreach ($pattern in $requiredPatterns) {
              if ($source -notmatch $pattern) {
                  throw ("MacroButtons synchronization safety check failed. Missing source pattern: {0}" -f $pattern)
              }
          }

          if ($source -match 'MacroButtonGetStatus|VBVMR_MacroButton_GetStatus') {
              throw 'MacroButtons synchronization must not depend on button-state readback.'
          }

          if ($source -notmatch 'MacroButtonSetStatus\([\s\S]{0,240}\$MacroButtonStateOnlyMode') {
              throw 'MacroButtons state update must use STATEONLY mode.'
          }

          Write-Host 'MacroButtons uses process-state assertions, STATEONLY and an auto-reset refresh event.'

      - name: Compile embedded Remote API interop C#
        shell: powershell
        run: |
          $source = Get-Content -LiteralPath 'VoiceMeeter-IdleWatcher.ps1' -Raw
          $startMarker = '$source = @"'
          $startIndex = $source.IndexOf($startMarker)

          if ($startIndex -lt 0) {
              throw 'Could not locate embedded C# interop source.'
          }

          $codeStart = $source.IndexOf([char]10, $startIndex) + 1
          $codeEnd = $source.IndexOf('"@', $codeStart)

          if (($codeStart -le 0) -or ($codeEnd -le $codeStart)) {
              throw 'Could not determine embedded C# interop source boundaries.'
          }

          $csharpSource = $source.Substring($codeStart, $codeEnd - $codeStart)
          $csharpSource = $csharpSource.Replace('$DllPath', 'C:VoiceMeeterVoicemeeterRemote64.dll')
          Add-Type -TypeDefinition $csharpSource -Language CSharp -ErrorAction Stop

          Write-Host 'Embedded Remote API interop C# compiled successfully.'

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
          }

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber -Confirm:$false
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force

          Write-Host ("PSScriptAnalyzer version: {0}" -f (Get-Module PSScriptAnalyzer).Version)

      - name: Report PSScriptAnalyzer findings
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = 'VoiceMeeter-IdleWatcher.ps1'

          $findings = @(Invoke-ScriptAnalyzer -Path $scriptPath -Severity Error,Warning,Information)

          if ($findings.Count -eq 0) {
              Write-Host 'PSScriptAnalyzer reported no findings.'
          }
          else {
              Write-Host ("PSScriptAnalyzer reported {0} finding(s):" -f $findings.Count)

              foreach ($finding in $findings) {
                  $line = $finding.Line
                  if (-not $line) { $line = '?' }

                  Write-Output ("[{0}] {1}, line {2}: {3}" -f
                      $finding.Severity,
                      $finding.RuleName,
                      $line,
                      $finding.Message)
              }
          }

          $errorFindings = @($findings | Where-Object { $_.Severity -eq 'Error' })

          if ($errorFindings.Count -gt 0) {
              throw ("PSScriptAnalyzer reported {0} Error-level finding(s). The workflow cannot pass until they are fixed." -f $errorFindings.Count)
          }

          Write-Host 'No Error-level findings. Warning and Information findings are reported but remain non-blocking.'
